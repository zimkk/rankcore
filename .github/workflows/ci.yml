name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Verify module files are tidy
      if: runner.os == 'Linux'
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum

    - name: Check formatting
      if: runner.os == 'Linux'
      run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build -v ./...

    - name: Test
      if: runner.os != 'Linux'
      run: go test ./...

    - name: Test (race detector)
      if: runner.os == 'Linux'
      run: go test -race ./...
